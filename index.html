
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERTİ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101510;color:white;font-family:Arial,sans-serif}
header{height:60px;padding:16px 20px;display:flex;justify-content:space-between;background:#172019}
.logo{font-size:27px;font-weight:bold;color:#a8e832}
.feed{height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:20px}
.video{width:100%;height:100%;max-width:500px;background:#202a20;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#a8e832;font-size:22px}
nav{height:60px;position:fixed;bottom:0;left:0;right:0;background:#172019;display:flex;justify-content:space-around;align-items:center}
nav span{font-size:14px;color:white}
nav b{color:#a8e832;font-size:23px}
</style>
</head>
<body>
<header>
<div class="logo">VERTİ</div>
<div>♡　✉</div>
</header>
<main class="feed">
<div class="video">VERTİ VIDEO AKIŞI</div>
</main>
<nav>
<span>⌂ Ana Sayfa</span>
<span>⌕ Keşfet</span>
<b>V</b>
<span>♡ Beğeni</span>
<span>♙ Profil</span>
</nav>
</body>
</html>
