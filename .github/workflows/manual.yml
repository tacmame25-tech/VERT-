
name: VERTI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Paketleri yükle
        run: npm install

      - name: Capacitor ayarlarını oluştur
        run: |
          echo '{"appId":"com.verti.app","appName":"VERTI","webDir":"dist"}' > capacitor.config.json

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Uygulamayı derle
        run: |
          npm run build
          npx cap sync android

      - name: APK oluştur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını hazırla
        uses: actions/upload-artifact@v4
        with:
          name: VERTI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
